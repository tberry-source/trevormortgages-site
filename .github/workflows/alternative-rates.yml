name: Refresh Home Trust alternative rates
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update-alternative-rates.py'
      - '.github/workflows/alternative-rates.yml'
permissions:
  contents: write
concurrency:
  group: alternative-rates
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh lender snapshot
        run: python3 scripts/update-alternative-rates.py
      - name: Publish changed rates
        run: |
          git add business-owner-alternative-rates.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Home Trust Classic posted rates'
          git push
